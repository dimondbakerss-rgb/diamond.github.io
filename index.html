<!DOCTYPE html>
<html>
<head>
<title>Mastered Ultra Instinct 👑</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: black;
    text-align: center;
    overflow-x: hidden;
}

/* APP UI CONTAINER */
.app {
    max-width: 500px;
    margin: auto;
    border: 2px solid silver;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 40px white;
}

/* NAVBAR */
.navbar {
    background: #111;
    padding: 15px;
}
.navbar a {
    color: silver;
    margin: 10px;
    text-decoration: none;
}

/* SECTIONS */
section {
    padding: 40px;
}

/* TITLE */
.glow {
    font-size: 35px;
    text-shadow: 0 0 20px white;
}

/* VIDEO */
iframe {
    width: 100%;
    height: 220px;
    border: none;
}

/* BUTTON */
.btn {
    padding: 10px 20px;
    background: silver;
    border: none;
    border-radius: 10px;
    margin-top: 15px;
}

/* GALLERY */
.gallery img {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}

/* POPUP */
#popup {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    top: 0;
    left: 0;
    justify-content: center;
    align-items: center;
}
#popup img {
    width: 90%;
}

/* CURSOR AURA */
.cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 20px white, 0 0 40px silver;
}
</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="app">

<div class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

<section id="home">
    <h1 class="glow">👑 MUI GOD MODE 👑</h1>
    <p id="typing"></p>
    <p id="time"></p>

    <iframe src="https://www.youtube.com/embed/REPLACE_ID"></iframe>

    <button class="btn">⚡ Enter Power ⚡</button>
</section>

<h2>⚡ Battles ⚡</h2>

<div class="gallery">
    <img src="https://images.alphacoders.com/100/1002177.jpg" onclick="openImg(this.src)">
    <img src="https://images.alphacoders.com/101/1011344.jpg" onclick="openImg(this.src)">
    <img src="https://images.alphacoders.com/132/1328388.jpeg" onclick="openImg(this.src)">
</div>

<div id="popup" onclick="closeImg()">
    <img id="popupImg">
</div>

<section id="about">
    <h2>About</h2>
    <p>@ar_manga_01 | Anime Editor ⚡</p>
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>YouTube: @ar_manga_01</p>
</section>

</div>

<!-- BACKGROUND MUSIC -->
<audio autoplay loop>
    <source src="https://www.myinstants.com/media/sounds/ui-theme.mp3" type="audio/mpeg">
</audio>

<script>
// TIME
setInterval(()=>{
    document.getElementById("time").innerText = new Date().toLocaleTimeString();
},1000);

// TYPING
let t="Mastered Ultra Instinct ⚡";
let i=0;
function type(){
    if(i<t.length){
        document.getElementById("typing").innerHTML+=t[i];
        i++;
        setTimeout(type,50);
    }
}
type();

// IMAGE POPUP
function openImg(src){
    popup.style.display="flex";
    popupImg.src=src;
}
function closeImg(){
    popup.style.display="none";
}

// CURSOR AURA
document.addEventListener("mousemove",(e)=>{
    let c=document.getElementById("cursor");
    c.style.left=e.clientX+"px";
    c.style.top=e.clientY+"px";
});
</script>

</body>
</html>

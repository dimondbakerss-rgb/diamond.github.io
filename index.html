<!DOCTYPE html>
<html>
<head>
<title>Dragon Power 🐉</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;
    background: radial-gradient(circle, #000000, #ff6600);
}

/* NAVBAR */
.navbar {
    background: black;
    padding: 15px;
    position: sticky;
    top: 0;
}
.navbar a {
    color: orange;
    margin: 15px;
    text-decoration: none;
    font-weight: bold;
}

/* SECTIONS */
section {
    padding: 60px;
}

/* TITLE */
.glow {
    font-size: 50px;
    color: orange;
    text-shadow: 0 0 20px red;
}

/* VIDEO */
iframe {
    width: 90%;
    max-width: 500px;
    height: 250px;
    border: 3px solid orange;
    border-radius: 10px;
    box-shadow: 0 0 20px red;
}

/* BUTTON */
.btn {
    padding: 12px 20px;
    background: orange;
    border: none;
    color: black;
    border-radius: 10px;
    margin-top: 20px;
    font-weight: bold;
}
.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px orange;
}

/* CARDS */
.card {
    background: #1a0000;
    margin: 15px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 15px red;
}

/* FOOTER */
.footer {
    padding: 20px;
    background: black;
    color: gray;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

<!-- HOME -->
<section id="home">
    <h1 class="glow">🐉 Dragon Power 🐉</h1>

    <p id="typing"></p>
    <p id="time"></p>

    <iframe src="https://www.youtube.com/embed/@ar_manga_01"></iframe>

    <br>

    <a href="https://youtube.com/@ar_manga_01" target="_blank">
        <button class="btn">🔥 Watch My Power 🔥</button>
    </a>
</section>

<!-- ABOUT -->
<section id="about">
    <h2>👤 About Me</h2>

    <div class="card">
        <p>I am @ar_manga_01</p>
        <p>Dragon Ball Editor 🐉</p>
        <p>Creating powerful anime edits 💥</p>
    </div>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>📞 Contact</h2>

    <div class="card">
        <p>YouTube: @ar_manga_01</p>
        <p>Email: mdrehaan258512@gmail.com</p>
    </div>
</section>

<!-- FOOTER -->
<div class="footer">
    🐉 Built by Rehaan
</div>

<script>
// TIME
function updateTime() {
    let now = new Date();
    document.getElementById("time").innerText = "⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime, 1000);

// TYPING
let text = "Power Level Rising... 💥";
let i = 0;

function typing() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 50);
    }
}
typing();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Brain Game 🧠</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: black;
    color: white;
}

.box {
    margin-top: 100px;
}

input {
    padding: 10px;
    font-size: 18px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 10px;
    background: silver;
    border: none;
    border-radius: 10px;
}

#result {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="box">
    <h1>🧠 Brain Game</h1>

    <p>Guess number (1-10)</p>

    <input id="guess" type="number">

    <br>

    <button onclick="check()">Check</button>

    <p id="result"></p>
</div>

<script>
let secret = 5;

function check() {
    let guess = document.getElementById("guess").value;

    if (guess == secret) {
        document.getElementById("result").innerText = "🎉 Correct!";
    } else {
        document.getElementById("result").innerText = "❌ Try again";
    }
}
</script>

</body>
</html>

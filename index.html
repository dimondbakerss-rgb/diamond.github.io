<!DOCTYPE html>
<html>
<head>
<title>Mastered Ultra Instinct 👑</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;
    background: black;
    overflow-x: hidden;
}

/* AURA BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, white 1px, transparent 1px);
    background-size: 40px 40px;
    animation: auraMove 8s linear infinite;
    opacity: 0.15;
}
@keyframes auraMove {
    from { transform: translateY(0); }
    to { transform: translateY(40px); }
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.8);
    padding: 15px;
    position: sticky;
    top: 0;
}
.navbar a {
    color: silver;
    margin: 15px;
    text-decoration: none;
    font-weight: bold;
}

/* SECTION */
section {
    padding: 60px;
}

/* TITLE */
.glow {
    font-size: 50px;
    color: #eee;
    text-shadow: 0 0 20px white, 0 0 40px silver;
}

/* VIDEO */
iframe {
    width: 90%;
    max-width: 550px;
    height: 300px;
    border-radius: 12px;
    border: 2px solid silver;
    box-shadow: 0 0 30px white;
}

/* BUTTON */
.btn {
    padding: 12px 25px;
    background: silver;
    color: black;
    border: none;
    border-radius: 10px;
    margin-top: 20px;
    font-weight: bold;
}

/* CARDS */
.card {
    background: #111;
    margin: 15px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px silver;
}

/* GALLERY */
.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
.gallery img {
    width: 250px;
    margin: 10px;
    border-radius: 12px;
    border: 2px solid silver;
    box-shadow: 0 0 20px white;
    transition: 0.3s;
    cursor: pointer;
}
.gallery img:hover {
    transform: scale(1.1);
    box-shadow: 0 0 40px white;
}

/* POPUP */
#popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}
#popup img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

/* FOOTER */
.footer {
    padding: 20px;
    background: black;
    color: gray;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

<section id="home">
    <h1 class="glow">👑 Mastered Ultra Instinct 👑</h1>

    <p id="typing"></p>
    <p id="time"></p>

    <iframe src="https://www.youtube.com/embed/REPLACE_ID"></iframe>

    <br>

    <a href="https://youtube.com/@ar_manga_01" target="_blank">
        <button class="btn">⚡ Enter God Mode ⚡</button>
    </a>
</section>

<!-- GALLERY -->
<h2>⚡ Legendary Battles ⚡</h2>

<div class="gallery">
    <img src="https://images.alphacoders.com/100/1002177.jpg" onclick="openImg(this.src)">
    <img src="https://images.alphacoders.com/101/1011344.jpg" onclick="openImg(this.src)">
    <img src="https://images.alphacoders.com/132/1328388.jpeg" onclick="openImg(this.src)">
    <img src="https://images.alphacoders.com/131/1310203.jpeg" onclick="openImg(this.src)">
</div>

<div id="popup" onclick="closeImg()">
    <img id="popupImg">
</div>

<section id="about">
    <h2>👤 About Me</h2>
    <div class="card">
        I am MOHAMMED REHAN <br>
        Dragon Ball Editor ⚡ <br>
        Mastered Ultra Instinct edits 👑
    </div>
</section>

<section id="contact">
    <h2>📞 Contact</h2>
    <div class="card">
        YouTube: @ar_manga_01 <br>
        Email: yourmail@gmail.com
    </div>
</section>

<div class="footer">
    👑 Built by Rehaan | GOD MODE
</div>

<script>
// TIME
function updateTime() {
    let now = new Date();
    document.getElementById("time").innerText = "⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime, 1000);

// TYPING
let text = "Calm Mind... Perfect Movement ⚡";
let i = 0;
function typing() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 40);
    }
}
typing();

// IMAGE ZOOM
function openImg(src) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupImg").src = src;
}
function closeImg() {
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Shadow Monarch 👑</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;
    background: black;
    overflow-x: hidden;
}

/* BACKGROUND PARTICLES */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, purple 1px, transparent 1px);
    background-size: 50px 50px;
    animation: moveBg 10s linear infinite;
    opacity: 0.2;
}

@keyframes moveBg {
    from {transform: translateY(0);}
    to {transform: translateY(50px);}
}

/* HERO */
.hero {
    padding: 50px;
    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

/* TITLE */
.glow {
    font-size: 50px;
    color: violet;
    text-shadow: 0 0 20px purple;
}

/* TYPING TEXT */
#typing {
    font-size: 22px;
    color: violet;
}

/* VIDEO */
.video-box iframe {
    width: 90%;
    max-width: 500px;
    height: 250px;
    border-radius: 12px;
    border: 2px solid purple;
    box-shadow: 0 0 20px purple;
}

/* BUTTON */
.btn {
    padding: 12px 20px;
    background: purple;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 20px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px violet;
}

/* CARDS */
.features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: #1a001a;
    margin: 15px;
    padding: 20px;
    border-radius: 12px;
    width: 200px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px purple;
}
</style>
</head>

<body>

<div class="hero">
    <h1 class="glow">👑 Shadow Monarch 👑</h1>

    <!-- TYPING TEXT -->
    <p id="typing"></p>

    <!-- LIVE TIME -->
    <p id="time"></p>

    <!-- VIDEO -->
    <div class="video-box">
        <iframe src="https://www.youtube.com/embed/REPLACE_ID" allowfullscreen></iframe>
    </div>

    <br>

    <!-- BUTTON -->
    <a href="https://youtube.com/@ar_manga_01" target="_blank">
        <button class="btn">Enter the Shadow Domain 💀</button>
    </a>
</div>

<!-- FEATURES -->
<div class="features">
    <div class="card">⚔️ Power</div>
    <div class="card">👑 Authority</div>
    <div class="card">💀 Evolution</div>
</div>

<script>
// LIVE TIME
function updateTime() {
    let now = new Date();
    document.getElementById("time").innerText = "⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime, 1000);

// TYPING EFFECT
let text = "Arise... My Shadow Army ⚔️";
let i = 0;

function typing() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 50);
    }
}
typing();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Mastered Ultra Instinct 👑</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;
    background: radial-gradient(circle, black, #0a0a0a);
}

/* NAVBAR */
.navbar {
    background: black;
    padding: 15px;
    position: sticky;
    top: 0;
}
.navbar a {
    color: silver;
    margin: 15px;
    text-decoration: none;
    font-weight: bold;
}

/* SECTIONS */
section {
    padding: 60px;
}

/* TITLE (SILVER GLOW) */
.glow {
    font-size: 50px;
    color: #e5e5e5;
    text-shadow: 
        0 0 10px white,
        0 0 20px silver,
        0 0 40px #cccccc;
}

/* VIDEO */
iframe {
    width: 90%;
    max-width: 500px;
    height: 250px;
    border: 3px solid silver;
    border-radius: 10px;
    box-shadow: 0 0 20px white;
}

/* BUTTON */
.btn {
    padding: 12px 20px;
    background: silver;
    border: none;
    color: black;
    border-radius: 10px;
    margin-top: 20px;
    font-weight: bold;
}
.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px white;
}

/* CARDS */
.card {
    background: #111;
    margin: 15px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 15px silver;
}

/* FOOTER */
.footer {
    padding: 20px;
    background: black;
    color: gray;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

<!-- HOME -->
<section id="home">
    <h1 class="glow">👑 Mastered Ultra Instinct 👑</h1>

    <p id="typing"></p>
    <p id="time"></p>

    <iframe src="https://www.youtube.com/embed/REPLACE_ID"></iframe>

    <br>

    <a href="https://youtube.com/@ar_manga_01" target="_blank">
        <button class="btn">⚡ Enter God Mode ⚡</button>
    </a>
</section>

<!-- ABOUT -->
<section id="about">
    <h2>👤 About Me</h2>

    <div class="card">
        <p>I am Mohammed Rehaan</p>
        <p>Dragon Ball Editor 👑</p>
        <p>Mastered Ultra Instinct edits ⚡</p>
    </div>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>📞 Contact</h2>

    <div class="card">
        <p>YouTube: @ar_manga_01</p>
        <p>Email: yourmail@gmail.com</p>
    </div>
</section>

<!-- FOOTER -->
<div class="footer">
    👑 Built by Rehaan | MUI Mode
</div>

<script>
// TIME
function updateTime() {
    let now = new Date();
    document.getElementById("time").innerText = "⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime, 1000);

// TYPING
let text = "Calm Mind... Perfect Power ⚡";
let i = 0;

function typing() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 50);
    }
}
typing();
</script>

</body>
</html>
